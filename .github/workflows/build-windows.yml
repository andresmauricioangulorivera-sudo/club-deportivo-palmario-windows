name: Crear instalador de Palmario para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Crear instalador
        run: npm run dist

      - name: Guardar una copia descargable del instalador
        uses: actions/upload-artifact@v4
        with:
          name: Palmario-Setup-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publicar el instalador para compartirlo
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0
          name: Club Deportivo Palmario para Windows
          body: Instalador para Windows. La aplicación necesita conexión a internet.
          files: dist/*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
